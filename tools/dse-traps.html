{ question: "The stopping potential is equal to the maximum photoelectron kinetic energy divided by e.", answer: true, explanation: "True. The relationship is eVs = Kmax." },

{ question: "Increasing light frequency increases the saturation current.", answer: false, explanation: "False. The saturation current depends mainly on intensity; frequency changes Kmax." },

{ question: "In a uniform electric field, β-particles (electrons) are deflected more than α-particles, in opposite directions.", answer: true, explanation: "True. This is due to their much smaller mass and opposite charge." },

{ question: "Natural ionizing radiation can be found in sea water, rocks, and the human body.", answer: true, explanation: "True. These contain traces of radionuclides (e.g., K-40)." },
                    { question: "All of an atom's mass is concentrated in its nucleus.", answer: false, explanation: "Incorrect. While the vast majority (over 99.9%) of an atom's mass is in the nucleus, the electrons orbiting the nucleus also contribute a small amount to the total mass." },
                    { question: "The penetrating power of beta particles is generally greater than that of alpha particles.", answer: true, explanation: "Correct. The order of penetrating power is typically gamma > beta > alpha. Alpha particles are large and highly ionizing, so they are stopped easily (by paper or skin). Beta particles are smaller and can penetrate further (stopped by thin aluminum)." },
                    { question: "Einstein's mass-energy equivalence principle is given by E = mc.", answer: false, explanation: "Incorrect. The famous equation is E = mc², where 'c' is the speed of light. This relationship shows that mass and energy are interchangeable." },
                    { question: "In the photoelectric effect, increasing the intensity of the incident light increases the maximum kinetic energy of the emitted electrons.", answer: false, explanation: "Incorrect. Increasing the intensity of the light increases the number of photons, which in turn increases the number of emitted electrons (the photoelectric current). The maximum kinetic energy of the electrons is determined by the frequency of the incident light, not its intensity." },
                    { question: "A chain reaction in a nuclear reactor is controlled by using control rods that absorb protons.", answer: false, explanation: "Incorrect. Control rods, typically made of materials like boron or cadmium, control the reaction rate by absorbing excess neutrons, not protons." },
                    { question: "Background radiation is solely due to man-made sources.", answer: false, explanation: "Incorrect. Background radiation comes from both natural sources (like radon gas, cosmic rays, radioactive elements in rocks) and man-made sources (like medical x-rays and nuclear fallout)." },
                    { question: "Nuclear fusion reactions release more energy per nucleon than fission reactions.", answer: true, explanation: "Correct. While a single fission event releases more total energy than a single fusion event, fusion of light elements (like hydrogen) releases significantly more energy per unit of mass (per nucleon)." },
                    { question: "Rutherford's gold foil experiment proved the existence of the neutron.", answer: false, explanation: "Incorrect. Rutherford's experiment led to the discovery of the atomic nucleus and the proposal of the planetary model of the atom. The neutron was discovered later by James Chadwick in 1932." },
                    { question: "The strong nuclear force is responsible for holding electrons in orbit around the nucleus.", answer: false, explanation: "Incorrect. The strong nuclear force is the force that binds protons and neutrons together within the nucleus. The electromagnetic force is responsible for keeping electrons in orbit." },
                    { question: "Light exhibits properties of both a particle and a wave.", answer: true, explanation: "Correct. This is the principle of wave-particle duality. Light can behave as an electromagnetic wave (showing diffraction and interference) and as a particle or photon (as seen in the photoelectric effect)." },
                    { question: "Radioactive decay is a random and spontaneous process.", answer: true, explanation: "Correct. It is impossible to predict when a specific nucleus will decay. The process is governed by probability, which is why we use statistical measures like half-life to describe it for a large number of atoms." },
                    { question: "The activity of a radioactive sample is measured in Joules.", answer: false, explanation: "Incorrect. The activity of a radioactive sample (the rate of decay) is measured in Becquerels (Bq), where 1 Bq = 1 decay per second. Energy is measured in Joules." },
      	            { "question": "An electron can exist in any orbit around a nucleus, as long as it has enough energy.", "answer": false, "explanation": "Incorrect. According to the Bohr model and quantum mechanics, electrons can only exist in specific, discrete energy levels or orbitals around the nucleus. They cannot exist in the spaces between these allowed orbits." },
                    { "question": "In a controlled nuclear fission reactor, the goal is to have the multiplication factor k exactly equal to 1.", "answer": true, "explanation": "Correct. A multiplication factor (k) of 1 means that each fission event causes, on average, exactly one other fission event. This leads to a self-sustaining chain reaction at a constant rate, which is known as a critical state." }
                ]
            };
            
            // DOM Elements
            const nameScreen = document.getElementById('name-screen');
            const nameInput = document.getElementById('name-input');
            const startBtn = document.getElementById('start-btn');
            const topicSelectionScreen = document.getElementById('topic-selection-screen');
            const quizScreen = document.getElementById('quiz-screen');
            const endScreen = document.getElementById('end-screen');
            const topicList = document.getElementById('topic-list');

            // Quiz elements
            const card = document.getElementById('card');
            const topicTitle = document.getElementById('topic-title');
            const questionText = document.getElementById('question-text');
            const answerButtons = document.getElementById('answer-buttons');
            const explanationText = document.getElementById('explanation-text');
            const feedbackText = document.getElementById('feedback-text');
            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('prev-btn');
            const progressIndicator = document.getElementById('progress-indicator');
            const backToTopicsBtn = document.getElementById('back-to-topics-btn');

            // End screen elements
            const endTitle = document.getElementById('end-title');
            const endMessage = document.getElementById('end-message');
            const retryWrongBtn = document.getElementById('retry-wrong-btn');
            const restartBtn = document.getElementById('restart-btn');

            // State variables
            let userName = '';
            let currentTopic = '';
            let questions = [];
            let currentQuestionIndex = 0;
            let userAnswers = [];
            let isRetryMode = false;

            function init() {
                // Populate topic list
                Object.keys(questionsData).forEach(topic => {
                    const button = document.createElement('button');
                    button.className = "text-left p-6 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 hover:border-cyan-400 transition-all duration-300 transform hover:-translate-y-1";
                    button.innerHTML = `<h3 class="text-xl font-bold text-slate-800">${topic}</h3><p class="text-slate-600 mt-1">${questionsData[topic].length} questions</p>`;
                    button.onclick = () => startQuiz(topic);
                    topicList.appendChild(button);
                });
            }

            function startQuiz(topic, retry = false) {
                currentTopic = topic;
                isRetryMode = retry;

                if (isRetryMode) {
                    const wrongAnswerIndices = userAnswers
                        .map((ua, index) => ({...ua, originalIndex: index}))
                        .filter(ua => !ua.correct)
                        .map(ua => ua.originalIndex);
                    
                    const originalQuestions = questionsData[currentTopic];
                    questions = wrongAnswerIndices.map(index => originalQuestions[userAnswers[index].originalIndex]);

                    userAnswers = questions.map((_, newIndex) => {
                        const originalQuestionIndex = userAnswers[wrongAnswerIndices[newIndex]].originalIndex;
                        return { answered: false, correct: null, userChoice: null, originalIndex: originalQuestionIndex };
                    });

                } else {
                    questions = [...questionsData[currentTopic]];
                    userAnswers = questions.map((_, index) => ({ answered: false, correct: null, userChoice: null, originalIndex: index }));
                }
                
                currentQuestionIndex = 0;
                showScreen('quiz');
                displayQuestion();
            }

            function displayQuestion() {
                if (currentQuestionIndex >= questions.length) {
                    showEndScreen();
                    return;
                }

                const question = questions[currentQuestionIndex];
                const answerState = userAnswers[currentQuestionIndex];

                card.classList.remove('flipped');
                
                setTimeout(() => {
                    topicTitle.textContent = currentTopic;
                    questionText.textContent = question.question;
                    explanationText.textContent = question.explanation;

                    if (answerState.answered) {
                        showFeedback(answerState.correct, answerState.userChoice);
                        card.classList.add('flipped');
                    } else {
                        answerButtons.style.display = 'grid';
                    }
                }, 150);

                updateProgress();
                prevBtn.disabled = currentQuestionIndex === 0;
                prevBtn.classList.toggle('opacity-50', prevBtn.disabled);
            }
            
            function handleAnswer(e) {
                const selectedAnswer = e.target.closest('.answer-btn').dataset.answer === 'true';
                const question = questions[currentQuestionIndex];
                const isCorrect = selectedAnswer === question.answer;

                userAnswers[currentQuestionIndex] = { ...userAnswers[currentQuestionIndex], answered: true, correct: isCorrect, userChoice: selectedAnswer };
                showFeedback(isCorrect, selectedAnswer);
            }

            function showFeedback(isCorrect, selectedAnswer) {
                card.classList.add('flipped');
                feedbackText.textContent = isCorrect ? 'Correct!' : 'Incorrect.';
                feedbackText.className = `text-2xl font-bold ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}`;
                answerButtons.style.display = 'none';
            }

            function nextQuestion() {
                if(currentQuestionIndex < questions.length - 1) {
                    currentQuestionIndex++;
                    displayQuestion();
                } else {
                    showEndScreen();
                }
            }

            function prevQuestion() {
                if (currentQuestionIndex > 0) {
                    currentQuestionIndex--;
                    displayQuestion();
                }
            }
            
            function updateProgress() {
                 progressIndicator.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            }

            function showEndScreen() {
                showScreen('end');
                const correctCount = userAnswers.filter(a => a.correct).length;
                const totalCount = questions.length;
                const wronglyAnsweredCount = totalCount - correctCount;

                if (wronglyAnsweredCount === 0) {
                    endTitle.textContent = `Congratulations, ${userName}!`;
                    endMessage.textContent = `You have fully understood the "${currentTopic}" stack!`;
                    retryWrongBtn.classList.add('hidden');
                } else {
                    endTitle.textContent = "Topic Completed!";
                    endMessage.textContent = `You scored ${correctCount} out of ${totalCount}. You have ${wronglyAnsweredCount} question(s) to review.`;
                    retryWrongBtn.classList.remove('hidden');
                }
            }

            function showScreen(screenId) {
                nameScreen.classList.add('hidden');
                topicSelectionScreen.classList.add('hidden');
                quizScreen.classList.add('hidden');
                endScreen.classList.add('hidden');
                document.getElementById(`${screenId}-screen`).classList.remove('hidden');
            }

            // Event Listeners
            startBtn.addEventListener('click', () => {
                const name = nameInput.value.trim();
                if (name) {
                    userName = name;
                    showScreen('topic-selection');
                } else {
                    nameInput.classList.add('ring-2', 'ring-rose-400');
                    setTimeout(() => nameInput.classList.remove('ring-2', 'ring-rose-400'), 1500);
                }
            });

            answerButtons.addEventListener('click', e => {
                if (e.target.matches('.answer-btn')) handleAnswer(e);
            });

            nextBtn.addEventListener('click', nextQuestion);
            prevBtn.addEventListener('click', prevQuestion);
            
            backToTopicsBtn.addEventListener('click', () => {
                isRetryMode = false;
                showScreen('topic-selection');
            });

            restartBtn.addEventListener('click', () => {
                isRetryMode = false;
                showScreen('name');
                nameInput.value = '';
            });

            retryWrongBtn.addEventListener('click', () => startQuiz(currentTopic, true));

            // Initial setup
            init();
        });
    
  </script>
</body>
</html>
