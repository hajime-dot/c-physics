<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>HK Physics MCQ Answer Finder</title>
  <meta name="theme-color" content="#990011" />
  <style>
    :root{
      --carmel:#990011;
      --carmel-dark:#7a000e;
      --carmel-soft:#f8e8ea;
      --bg:#f4f5f7;
      --panel:#ffffff;
      --muted:#5c5c5c;
      --text:#1a1a1a;
      --accent:#990011;
      --accent2:#7a000e;
      --border:#e2e4e8;
      --focus:#c45a66;
      --radius:16px;
      --shadow:0 2px 8px rgba(0,0,0,.06);
      --badge-bg:linear-gradient(180deg,#34d399,#10b981);
    }
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{height:100%;margin:0}
    body{
      color:var(--text);
      font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Noto Sans,Arial,sans-serif;
      background:var(--bg);
      min-height:100%;
    }
    .wrap{
      width:min(1180px,100%);
      margin:0 auto;
      padding:clamp(12px,2vw,20px);
      display:grid;
      gap:14px;
    }
    @media (orientation:landscape) and (min-width:900px){
      .wrap{grid-template-columns:420px 1fr; align-items:start; gap:16px;}
    }
    .panel{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:16px;
    }
    .field{display:grid; grid-template-columns:92px 1fr; gap:10px; align-items:center; margin-bottom:10px}
    .field label{color:var(--muted); font-size:14px; font-weight:600}
    select,input{
      font:inherit; width:100%;
      border:1px solid var(--border); border-radius:12px;
      padding:12px 14px; background:#fff; outline:none;
      min-height:48px;
    }
    select:focus,input:focus{border-color:var(--carmel); box-shadow:0 0 0 3px rgba(153,0,17,.22)}
    .actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px}
    .btn{
      border:0; border-radius:12px; padding:13px 10px; font-weight:800; cursor:pointer;
      min-height:48px; touch-action:manipulation;
    }
    .btn.primary{background:linear-gradient(180deg,#b30018,var(--carmel)); color:#fff}
    .btn.primary:hover{background:linear-gradient(180deg,var(--carmel),var(--carmel-dark))}
    .btn.alt{background:linear-gradient(180deg,#a80014,var(--carmel-dark)); color:#fff}
    .btn.alt:hover{background:var(--carmel-dark)}
    .btn.neutral{background:var(--carmel-soft); color:var(--carmel-dark); border:1px solid #e8c5ca}
    .list{display:grid; gap:8px; max-height:min(70vh,720px); overflow:auto; padding-right:2px}
    .rowitem{
      display:grid; grid-template-columns:1.1fr .9fr 1fr 64px; gap:8px; align-items:center;
      background:linear-gradient(180deg,#fff,var(--carmel-soft));
      border:1px solid var(--border); border-radius:14px; padding:12px 14px; min-height:58px;
    }
    @media (max-width:700px){
      .rowitem{grid-template-columns:1fr 64px; gap:6px}
      .rowitem .hide-sm{display:none}
      .actions{grid-template-columns:1fr}
    }
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px}
    .answer-badge{
      width:48px; height:48px; border-radius:14px; display:inline-flex; align-items:center; justify-content:center;
      background:var(--badge-bg); color:#fff; font-weight:900; font-size:20px;
      box-shadow:0 6px 14px rgba(16,185,129,.35);
    }
    .empty{color:var(--muted); font-size:14px; padding:8px 2px}
  </style>
</head>
<body>

    <section class="panel" aria-label="Search">

  function postHeight(){
    try{ parent.postMessage({type:'embed-size', height: document.documentElement.scrollHeight}, '*'); }catch(e){}
  }
  new ResizeObserver(postHeight).observe(document.documentElement);
  window.addEventListener('load', postHeight);

  const examEl = document.getElementById('exam');
  const yearEl = document.getElementById('year');
  const qEl = document.getElementById('q');
  const qP2El = document.getElementById('qP2');
  const qTextField = document.getElementById('qTextField');
  const qP2Field = document.getElementById('qP2Field');
  const list = document.getElementById('list');

  const P2_SEC = {1:'A',2:'B',3:'C',4:'D'};
  const P2_NAME = {A:'Astronomy',B:'Atomic World',C:'Energy',D:'Medical Physics'};

  function parseCSVToIndex(text){
    const lines = text.trim().split(/\r?\n/);
    if(lines.length) lines.shift();
    const idx = { CE: Object.create(null), AL: Object.create(null) };
    for(const line of lines){
      const parts = line.split(',');
      if(parts.length < 4) continue;
      const Exam = parts[0].trim(), Year = parts[1].trim(), Question = Number(parts[2].trim()), Answer = parts[3].trim();
      if(Exam !== 'CE' && Exam !== 'AL') continue;
      if(!idx[Exam][Year]) idx[Exam][Year] = Object.create(null);
      idx[Exam][Year][Question] = Answer;
    }
    return idx;
  }
  const ceal = parseCSVToIndex(cealCsv);

  function mode(){ return examEl.value; }

  function parseRange(input){
    if(!input) return [];
    const full2half = s => s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
    const cleaned = full2half(input).replace(/\s+/g,'').replace(/[—–−~～]/g,'-');
    const parts = cleaned.split(',');
    const nums = new Set();
    for(const p of parts){
      if(!p) continue;
      const m = p.split('-');
      if(m.length===1){
        const n = Number(m[0]);
        if(Number.isInteger(n) && n>0) nums.add(n);
      } else if(m.length===2){
        let a = Number(m[0]), b = Number(m[1]);
        if(Number.isInteger(a) && Number.isInteger(b)){
          if(a>b) [a,b]=[b,a];
          for(let i=a;i<=b;i++) nums.add(i);
        }
      }
    }
    return Array.from(nums).sort((x,y)=>x-y);
  }

  function parseP2Selection(){
    const v = qP2El.value;
    if(!v){
      // all 1.1–4.8
      const all=[];
      for(let s=1;s<=4;s++) for(let q=1;q<=8;q++) all.push({sec:P2_SEC[s], n:q, label:`${s}.${q}`});
      return all;
    }
    const [sStr,qStr] = v.split('.');
    const s = Number(sStr), q = Number(qStr);
    return [{sec:P2_SEC[s], n:q, label:`${s}.${q}`}];
  }

  function setMode(){
    const m = mode();
    const isP2 = m === '2';
    qTextField.hidden = isP2;
    qTextField.style.display = isP2 ? 'none' : '';
    qP2Field.hidden = !isP2;
    qP2Field.style.display = isP2 ? '' : 'none';
    if(isP2) qEl.value = '';
    fillYears();
    list.innerHTML='';
    postHeight();
    doFind();
  }

  function fillYears(){
    const m = mode();
    let years=[];
    if(m==='1A') years = Object.keys(dseData).map(Number).sort((a,b)=>a-b);
    else if(m==='2') years = Object.keys(paper2Data).map(Number).sort((a,b)=>a-b);
    else if(m==='CE') years = Object.keys(ceal.CE||{}).map(Number).sort((a,b)=>a-b);
    else years = Object.keys(ceal.AL||{}).map(Number).sort((a,b)=>a-b);
    yearEl.innerHTML = '<option value="">Select</option>' + years.map(y=>`<option>${y}</option>`).join('');
  }

  function findRows(){
    const year = yearEl.value;
    if(!year) return [];
    const rows=[];
    const m = mode();
    if(m==='1A'){
      const qs = parseRange(qEl.value);
      const map = dseData[year]||{};
      const nums = qs.length ? qs : Object.keys(map).map(Number).sort((a,b)=>a-b);
      for(const n of nums) rows.push({label:`DSE ${year}`, sub:`Paper 1A`, q:`Q${n}`, ans: map[String(n)] ?? map[n] ?? null});
    } else if(m==='2'){
      const bySec = paper2Data[year]||{};
      const picks = parseP2Selection();
      for(const p of picks){
        const map = bySec[p.sec]||{};
        rows.push({
          label:`DSE ${year}`,
          sub:`P2 ${p.sec} · ${P2_NAME[p.sec]||''}`,
          q:p.label,
          ans: map[String(p.n)] ?? map[p.n] ?? null
        });
      }
    } else {
      const qs = parseRange(qEl.value);
      const store = ((m==='CE' ? ceal.CE : ceal.AL)[year])||{};
      const nums = qs.length ? qs : Object.keys(store).map(Number).sort((a,b)=>a-b);
      for(const n of nums) rows.push({label: m, sub: String(year), q:`Q${n}`, ans: store[n] ?? null});
    }
    return rows;
  }

  function render(rows){
    list.innerHTML='';
    if(!rows.length){
      list.innerHTML = '<div class="empty">No rows — pick a year.</div>';
      postHeight(); return;
    }
    for(const r of rows){
      const item=document.createElement('div');
      item.className='rowitem';
      item.innerHTML = `<div class="mono">${r.label}</div>
        <div class="mono hide-sm">${r.sub}</div>
        <div class="mono">${r.q}</div>
        <div></div>`;
      const ansWrap=item.lastElementChild;
      if(r.ans && String(r.ans).toLowerCase()==='cancelled'){
        ansWrap.innerHTML='<span style="color:#92400e;font-weight:800">Cancelled</span>';
      } else if(r.ans){
        const b=document.createElement('span'); b.className='answer-badge'; b.textContent=r.ans; ansWrap.appendChild(b);
      } else {
        ansWrap.innerHTML='<span style="color:#dc2626;font-weight:700">N/A</span>';
      }
      list.appendChild(item);
    }
    postHeight();
  }

  function doFind(){ render(findRows()); }

  examEl.addEventListener('change', ()=>{ setMode(); });
  document.getElementById('btnClear').addEventListener('click', ()=>{
    qEl.value=''; qP2El.value=''; yearEl.value=''; list.innerHTML=''; postHeight();
  });
  document.getElementById('btnGoogle').addEventListener('click', ()=>{
    const year=yearEl.value; if(!year){ alert('Select a year first.'); return; }
    const m = mode();
    let query='';
    if(m==='1A'){
      let qs=parseRange(qEl.value); if(!qs.length) qs=[1];
      query=`HKDSE PHYSICS PAPER 1A ${year} Q${qs[0]}`;
    } else if(m==='2'){
      const picks = parseP2Selection();
      const first = picks[0] || {sec:'B', n:1, label:'2.1'};
      query=`HKDSE PHYSICS PAPER 2 ${year} ${first.label}`;
    } else if(m==='CE'){
      let qs=parseRange(qEl.value); if(!qs.length) qs=[1];
      query=`HKCEE PHYSICS ${year} Q${qs[0]}`;
    } else {
      let qs=parseRange(qEl.value); if(!qs.length) qs=[1];
      query=`HKALE PHYSICS ${year} Q${qs[0]}`;
    }
    window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`,'_blank','noopener,noreferrer');
  });
  qEl.addEventListener('input', doFind);
  yearEl.addEventListener('change', doFind);
  qP2El.addEventListener('change', doFind);

  setMode();
  yearEl.value='2012'; qEl.value='21'; doFind();
  </script>
</body>
</html>
